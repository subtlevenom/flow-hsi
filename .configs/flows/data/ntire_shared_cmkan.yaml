defaults:
  - ntire
  - _self_

params:
  spectral_channels: ${spectral_channels}
  train:
    source: ${dataset_root}/train/source
    target: ${dataset_root}/train/target
    batch_size: 1
    crop_size: 32
  val:
    source: ${dataset_root}/test/source
    target: ${dataset_root}/test/target
    batch_size: 1
    crop_size: 128
  test:
    source: ${dataset_root}/test/source
    target: ${dataset_root}/test/target
    batch_size: 1
