name: flow
params:
  metadata:
    - layer: spectral
      inputs: [src]
      outputs: [res]
  layers:
    spectral:
      model: ggpir.SpectralEncoderDecoder
      params:
        head: pretrain
        spectral_channels: 31
        channels: 64
        branch_depths: [3, 3, 4]
        branch_channels: [48, 96, 192]
        detail_depth: 2
        fusion_depth: 2
        heads: 4
        head_depth: 2
        pixel_chunk_size: 4096
        checkpoint_blocks: true
