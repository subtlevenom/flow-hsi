name: flow
params:
  metadata:
    - layer: spectral
      inputs: [src]
      outputs: [res]
  layers:
    spectral:
      model: ggpir.SpectralEncoderDecoder
      params:
        head: pretrain
        spectral_channels: 31
        channels: 48
        stage_blocks: [2, 2, 4]
        detail_depth: 2
        head_depth: 2
        checkpoint_blocks: true
